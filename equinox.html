<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equinox Project</title>
    <style>
        :root {
            --bg-primary: #191f28;
            --bg-secondary: #222a36;
            --bg-accent: #2c3645;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --gold: #e2b45c;
            --emerald: #10b981;
            --rose: #f43f5e;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Animación BIOS PC */
        #boot-screen {
            position: fixed; top:0; left:0; width: 100vw; height: 100vh;
            background-color: #090d16; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .boot-title {
            color: var(--gold); font-size: 2.8rem; font-weight: 300; letter-spacing: 0.6rem;
            text-transform: uppercase; animation: pulse 2.2s infinite ease-in-out; margin-bottom: 20px;
        }
        .boot-sub { color: var(--text-muted); font-size: 0.85rem; font-family: monospace; line-height: 1.6; }
        
        /* Login */
        #login-screen {
            position: fixed; top:0; left:0; width: 100vw; height: 100vh;
            background-color: var(--bg-primary); z-index: 9998; display: none;
            justify-content: center; align-items: center;
        }
        .login-card {
            background-color: var(--bg-secondary); border: 1px solid var(--border);
            padding: 45px; border-radius: 12px; width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            text-align: center;
        }
        .login-card h2 { color: var(--gold); margin-bottom: 30px; font-weight: 400; font-size: 1.6rem; letter-spacing: 2px;}

        /* Layout */
        #app-layout { display: none; height: 100vh; flex-direction: column; }
        header {
            background-color: var(--bg-secondary); border-bottom: 1px solid var(--border);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 1.3rem; color: var(--gold); font-weight: 400; letter-spacing: 1px; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        nav {
            width: 260px; background-color: var(--bg-secondary); border-right: 1px solid var(--border);
            padding: 25px 12px; display: flex; flex-direction: column; gap: 8px;
        }
        nav button {
            background: none; border: none; color: var(--text-main); padding: 12px 18px;
            text-align: left; font-size: 0.95rem; border-radius: 6px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        nav button:hover, nav button.active { background-color: var(--bg-accent); color: var(--gold); }

        .view-wrapper { flex: 1; padding: 40px; overflow-y: auto; }
        .content-view { display: none; }
        .content-view.active { display: block; }
        h2.view-title { font-size: 1.6rem; margin-bottom: 25px; font-weight: 400; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        /* Formularios */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            background-color: var(--bg-secondary); border: 1px solid var(--border);
            padding: 12px 14px; color: var(--text-main); border-radius: 6px; outline: none; font-size: 0.95rem;
        }
        input:focus, select:focus { border-color: var(--gold); }
        
        button.btn, a.btn {
            background-color: var(--gold); color: #111; padding: 12px 24px; border: none;
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s;
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
        }
        button.btn:hover, a.btn:hover { opacity: 0.95; }
        button.btn-danger { background-color: var(--rose); color: #fff; }
        button.btn-secondary { background-color: var(--bg-accent); color: var(--text-main); border: 1px solid var(--border); }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        th { background-color: var(--bg-secondary); color: var(--text-muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background-color: var(--bg-accent); }
        
        .monto-debe { color: var(--emerald); font-weight: 500; }
        .monto-haber { color: var(--rose); font-weight: 500; }

        footer {
            background-color: #11161d; text-align: center; padding: 15px;
            color: var(--text-muted); font-size: 0.8rem; letter-spacing: 1px; border-top: 1px solid var(--border);
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.3; transform: scale(0.97); }
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="boot-title">Equinox Project</div>
        <div class="boot-sub">> LOADING HTML5 ENGINE SYSTEM... DONE</div>
        <div class="boot-sub">> BROWSER STORAGE INTEGRITY... SECURED</div>
        <div class="boot-sub">> WORKING DISCONNECTED FROM INTERNET... 100% LOCAL</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="letter-spacing: 4px;">EQUINOX CORE</h2>
            <div class="form-group" style="margin-bottom: 20px; text-align: left;">
                <label>Usuario Master</label>
                <input type="text" value="admin" disabled style="opacity: 0.7;">
            </div>
            <div class="form-group" style="margin-bottom: 30px; text-align: left;">
                <label>Contraseña de Acceso</label>
                <input type="password" id="login-pass" placeholder="••••••••" autofocus>
            </div>
            <button class="btn" style="width: 100%;" onclick="handleLogin()">Iniciar Aplicación</button>
        </div>
    </div>

    <div id="app-layout">
        <header>
            <h1>EQUINOX WORKSPACE</h1>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Ecosistema Contable Autónomo</div>
        </header>
        
        <div class="main-container">
            <nav>
                <button onclick="switchView('view-plan')" class="active">📊 Plan de Cuentas</button>
                <button onclick="switchView('view-movimientos')">📈 Registrar Asiento</button>
                <button onclick="switchView('view-compras')">🛒 Libro de Compras</button>
                <button onclick="switchView('view-ventas')">💰 Libro de Ventas</button>
                <button onclick="switchView('view-estados')">🗒 Estados Financieros</button>
                <button onclick="switchView('view-config')" style="margin-top: auto;">⚠️ Purga de Registros</button>
            </nav>
            
            <main class="view-wrapper">
                <!-- PLAN DE CUENTAS -->
                <div id="view-plan" class="content-view active">
                    <h2 class="view-title">Estructura del Plan de Cuentas</h2>
                    <div style="background-color: var(--bg-secondary); padding: 25px; border-radius: 8px; border: 1px solid var(--border);">
                        <h4 id="form-cuenta-title" style="margin-bottom: 15px; color: var(--gold);">Registrar Nueva Cuenta Contable</h4>
                        <input type="hidden" id="cuenta-is-edit" value="false">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Código de Cuenta</label>
                                <input type="text" id="cuenta-codigo" placeholder="Ej: 1.1.01">
                            </div>
                            <div class="form-group">
                                <label>Nombre Comercial / Descriptor</label>
                                <input type="text" id="cuenta-nombre" placeholder="Ej: Caja General">
                            </div>
                            <div class="form-group">
                                <label>Naturaleza</label>
                                <select id="cuenta-tipo">
                                    <option value="Activo">Activo</option>
                                    <option value="Pasivo">Pasivo</option>
                                    <option value="Patrimonio">Patrimonio</option>
                                    <option value="Ingreso">Ingreso</option>
                                    <option value="Egreso">Egreso</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Saldo Inicial ($)</label>
                                <input type="number" id="cuenta-saldo" step="0.01" value="0.00">
                            </div>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button class="btn" onclick="guardarCuenta()">Guardar Cuenta</button>
                            <button class="btn btn-secondary" onclick="limpiarFormCuenta()">Limpiar</button>
